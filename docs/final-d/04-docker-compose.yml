services:
  postgres:
    image: postgres:16-alpine
    container_name: kpqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kpqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kpqa_db
    # 默认仅绑定本机回环，避免直接暴露公网
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kpqa-redis
    restart: unless-stopped
    # 默认仅绑定本机回环，避免直接暴露公网
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  backend:
    image: ${BACKEND_IMAGE:-kpqa-backend:local}
    pull_policy: ${BACKEND_PULL_POLICY:-never}
    container_name: kpqa-backend
    restart: unless-stopped
    env_file:
      - ./.env.deploy
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    volumes:
      - audio_data:/data/audio
    command: ["node", "--experimental-specifier-resolution=node", "dist/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: kpqa-caddy
    restart: unless-stopped
    env_file:
      - ./.env.deploy
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FRONTEND_DIST_PATH:-/mnt/c/Users/Administrator/Downloads/zsxq-4/dist}:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  audio_data:
  caddy_data:
  caddy_config:
