version: "3.9"

# 生产环境 Docker Compose 配置（使用 Supabase 外部数据库）
# 使用方法：
# 1. 复制 deploy/.env.production.example 为 deploy/.env.production，填入生产环境值
# 2. 确保 DATABASE_URL 指向 Supabase 连接串
# 3. 执行：docker compose -f deploy/docker-compose.prod.yml up -d

services:
  redis:
    image: redis:7-alpine
    container_name: kpqa-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: kpqa-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
