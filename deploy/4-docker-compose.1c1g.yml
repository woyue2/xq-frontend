services:
  postgres:
    image: postgres:16-alpine
    container_name: kpqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kpqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kpqa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    deploy:
      resources:
        limits:
          cpus: "0.7"
          memory: "384M"
        reservations:
          cpus: "0.3"
          memory: "256M"

  redis:
    image: redis:7-alpine
    container_name: kpqa-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "160M"
        reservations:
          cpus: "0.1"
          memory: "64M"

  backend:
    # 修改原因：切换为“本地预构建镜像”，避免服务器每次启动都安装依赖和编译。
    image: kpqa-backend:local
    # 修改原因：强制仅使用本地镜像，避免 Compose 自动去远程拉取同名镜像导致限流失败。
    pull_policy: never
    container_name: kpqa-backend
    volumes:
      # 修改原因：为音频文件提供独立持久卷，容器重建后仍可读取历史录音。
      - audio_data:/data/audio
      # 修改原因：为本地图片兜底目录提供持久卷，避免 backend 重建后丢失 /static/image 文件。
      - image_data:/app/static/image
    # 修改原因：后端敏感环境变量统一放入 deploy/.env.prod，降低误提交风险。
    env_file:
      - ./.env.prod
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    # 修改原因：在编排层强制指定 Node ESM 兼容启动参数，避免镜像内默认 CMD 不一致导致的导入失败。
    command: ["node", "--experimental-specifier-resolution=node", "dist/server.js"]
    # 修改原因：Chromium 在容器内渲染 PDF 时依赖 /dev/shm，增大共享内存可降低崩溃概率。
    shm_size: "256m"
    healthcheck:
      # 修改原因：后端服务端口为 3000，健康检查需与实际监听端口保持一致。
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: "512M"
        reservations:
          cpus: "0.3"
          memory: "256M"

  caddy:
    # 修改原因：补齐“前端静态资源 + /api 反向代理”入口，便于本地按服务器形态联调。
    image: caddy:2-alpine
    container_name: kpqa-caddy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 修改原因：统一通过 Caddyfile 管理前端路由和后端代理规则。
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 修改原因：直接挂载前端构建产物 dist，避免在部署编排层引入额外前端运行容器。
      - ../dist:/srv:ro
      # 修改原因：保留 Caddy 运行时数据目录，便于后续启用 HTTPS 证书自动管理。
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "128M"
        reservations:
          cpus: "0.1"
          memory: "64M"

volumes:
  postgres_data:
  redis_data:
  # 修改原因：给 backend 音频文件单独持久化，降低实例重建导致文件丢失风险。
  # ⚠️ 不确定因素：多节点部署时，named volume 默认不跨主机共享，需外部共享存储。
  audio_data:
  # 修改原因：持久化 backend 图片兜底目录（/app/static/image），保障容器重建后图片可访问。
  image_data:
  # 修改原因：预留网关运行时持久目录，后续启用 HTTPS 可直接复用。
  caddy_data:
  caddy_config:
