version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kpqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kpqa
      POSTGRES_PASSWORD: kpqa_password
      POSTGRES_DB: kpqa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    deploy:
      resources:
        limits:
          cpus: "0.7"
          memory: "384M"
        reservations:
          cpus: "0.3"
          memory: "256M"

  redis:
    image: redis:7-alpine
    container_name: kpqa-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "160M"
        reservations:
          cpus: "0.1"
          memory: "64M"

  backend:
    image: node:20-alpine
    container_name: kpqa-backend
    working_dir: /app
    # 挂载本地 backend 目录，方便直接使用当前代码
    volumes:
      - ../backend:/app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://kpqa:kpqa_password@postgres:5432/kpqa_db?connection_limit=5
      REDIS_URL: redis://redis:6379
      JWT_SECRET: "please-change-this-in-production"
      JWT_EXPIRES_IN: "7d"
      # 可选：如启用 AI 自动审核回调，请在生产环境中为内部回调接口配置独立令牌
      # 建议将实际值放入独立的 .env.production 文件中，通过 docker compose 引用
      # AI_INTERNAL_TOKEN: "please-set-strong-random-token-in-real-env"
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    # 简单的一步到位命令：安装依赖 + 构建 + 启动
    command: >
      sh -c "npm ci && npm run build && node dist/server.js"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: "512M"
        reservations:
          cpus: "0.3"
          memory: "256M"

volumes:
  postgres_data:
  redis_data:
