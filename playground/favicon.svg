<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="frozenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景圆角矩形，提供对比度 -->
  <rect width="200" height="200" rx="40" fill="#020617"/>
  <!-- 1:1 复刻自 logo-v4-8colors.html -->
  <path d="M60,100 C60,70 80,60 100,60 C120,60 140,70 140,100 C140,130 120,140 100,140 C80,140 60,130 60,100 M100,140 C80,140 60,150 60,170 M100,60 C120,60 140,50 140,30" 
        fill="none" 
        stroke="url(#frozenGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  <!-- 精确复刻：r="15", fill="#f8fafc" -->
  <circle cx="100" cy="100" r="15" fill="#f8fafc" />
</svg>
