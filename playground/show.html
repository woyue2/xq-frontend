<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>底部气泡 Playground</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 40px 16px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    p {
      font-size: 13px;
      color: #6b7280;
      margin-top: 0;
      margin-bottom: 24px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }

    .card {
      flex: 1 1 260px;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 20px 18px 24px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 16px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.4);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
      opacity: 0.9;
    }

    /* 底部中间气泡 */
    .toast-container {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      min-width: 180px;
      max-width: 320px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.92);
      color: #f9fafb;
      text-align: center;
      font-size: 14px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.45);
      opacity: 0;
      transform: translateY(24px) scale(0.95);
    }

    .toast.show {
      animation: bubbleToast 0.45s cubic-bezier(0.21, 0.8, 0.35, 1) forwards;
    }

    /* 底部右侧卡片气泡 */
    .toast-wrapper {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast-card {
      width: 260px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #111827;
      color: #e5e7eb;
      font-size: 13px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(24px) scale(0.96);
    }

    .toast-card.show {
      animation: bubbleCard 0.5s cubic-bezier(0.21, 0.8, 0.35, 1) forwards;
    }

    .toast-title {
      font-size: 13px;
      font-weight: 600;
      color: #f9fafb;
      margin-bottom: 4px;
    }

    .toast-desc {
      font-size: 12px;
      color: #9ca3af;
    }

    /* 示例三：圆形气泡从底部升起 */
    .bubble-circle {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%) translateY(32px) scale(0.5);
      width: 56px;
      height: 56px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #fef9c3, #facc15);
      box-shadow: 0 14px 40px rgba(202, 138, 4, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2937;
      font-size: 11px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      text-align: center;
      padding: 6px;
      box-sizing: border-box;
    }

    .bubble-circle.show {
      animation: bubbleCircle 0.9s ease-out forwards;
    }

    /* 动画：矩形 toast 冒泡上升 */
    @keyframes bubbleToast {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.9);
      }
      60% {
        opacity: 1;
        transform: translateY(-6px) scale(1.03);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 动画：右侧卡片轻微上浮 */
    @keyframes bubbleCard {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.95);
      }
      65% {
        opacity: 1;
        transform: translateY(-4px) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 动画：圆形气泡从底部冒出再淡出 */
    @keyframes bubbleCircle {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(40px) scale(0.4);
      }
      45% {
        opacity: 1;
        transform: translateX(-50%) translateY(-4px) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-40px) scale(0.9);
      }
    }
  </style>
</head>
<body>
  <h1>底部气泡 Playground</h1>
  <p>下面是几个可玩的示例：底部中间圆角气泡、底部右侧卡片气泡，以及真正像“小气泡从底下升上来”的圆形气泡。</p>

  <div class="row">
    <!-- 示例 1：底部中间气泡 -->
    <div class="card">
      <div class="card-title">示例一：底部中间气泡</div>
      <div class="card-desc">
        类似全局 toast，适合简单的「请联系老师」这类一句话提示。
      </div>
      <button class="btn" onclick="showBottomCenterToast('请联系老师')">
        模拟“忘记密码？”点击
      </button>
    </div>

    <!-- 示例 2：底部右侧卡片气泡 -->
    <div class="card">
      <div class="card-title">示例二：底部右侧卡片</div>
      <div class="card-desc">
        可以放标题 + 描述，适合讲清楚下一步应该找谁 / 怎么做。
      </div>
      <button class="btn" onclick="showBottomRightCard()">
        模拟“忘记密码？”点击
      </button>
    </div>

    <!-- 示例 3：圆形气泡上升 -->
    <div class="card">
      <div class="card-title">示例三：圆形气泡从底部升起</div>
      <div class="card-desc">
        点击时会有一个小圆球从底部“冒泡”上来，然后淡出，适合做比较可爱的提示。
      </div>
      <button class="btn" onclick="showBubbleCircle()">
        播放圆形气泡动画
      </button>
    </div>
  </div>

  <!-- 示例一：底部中间气泡 DOM -->
  <div class="toast-container">
    <div id="toast" class="toast"></div>
  </div>

  <!-- 示例二：底部右侧卡片 DOM -->
  <div class="toast-wrapper">
    <div id="toast-card" class="toast-card">
      <div class="toast-title">请联系老师</div>
      <div class="toast-desc">
        如需重置密码，请把手机号或账号发送给班主任老师，由老师统一处理。
      </div>
    </div>
  </div>

  <!-- 示例三：底部圆形气泡 DOM -->
  <div id="bubble-circle" class="bubble-circle">
    请联系老师
  </div>

  <script>
    function showBottomCenterToast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');

      clearTimeout(window.__toastTimer1);
      window.__toastTimer1 = setTimeout(() => {
        el.classList.remove('show');
      }, 3000);
    }

    function showBottomRightCard() {
      const card = document.getElementById('toast-card');
      card.classList.add('show');

      clearTimeout(window.__toastTimer2);
      window.__toastTimer2 = setTimeout(() => {
        card.classList.remove('show');
      }, 4000);
    }

    function showBubbleCircle() {
      const el = document.getElementById('bubble-circle');
      if (!el) return;
      // 先移除再强制重绘，确保多次点击可以重复播放动画
      el.classList.remove('show');
      // eslint-disable-next-line @typescript-eslint/no-unused-expressions
      void el.offsetWidth;
      el.classList.add('show');
    }
  </script>
</body>
</html>
